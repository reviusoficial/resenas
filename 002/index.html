<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cómo estuvo tu experiencia?</title>

<!-- ============================================================= -->
<!--  ⚙️  CONFIGURA AQUÍ (edita SOLO estas líneas de abajo)        -->
<!--     Esto es lo único que cambias por cada restaurante.        -->
<!-- ============================================================= -->
<script>
  // 1) Pega el enlace de reseñas de Google Maps del local (entre las comillas):
  const ENLACE_GOOGLE_MAPS = "https://www.google.com/maps/place/Chifa+Oro/@-12.0254552,-76.9062758,19.94z/data=!4m17!1m8!3m7!1s0x9105c3e4d876b5e3:0xc895074399b9e9b2!2sLa+Esperanza,+Lima+15491!3b1!8m2!3d-12.0259518!4d-76.9061426!16s%2Fg%2F1hl3hn0g1!3m7!1s0x9105c3ba89435b2d:0xb825592a2df0c71f!8m2!3d-12.0253953!4d-76.9060848!9m1!1b1!16s%2Fg%2F11rw94zxqg?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D";

  // 2) Nombre del local (sale en el título):
  const NOMBRE_DEL_LOCAL = "Tu Restaurante";
</script>
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f2f4f7;
    color: #202124;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .tarjeta {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    padding: 36px 28px 30px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
    animation: aparecer .4s ease;
  }

  @keyframes aparecer { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---- Zona del logo ---- */
  .logo-zona { margin-bottom: 22px; min-height: 70px; display: flex; align-items: center; justify-content: center; }
  #logo { max-height: 72px; max-width: 200px; object-fit: contain; }
  #logo-placeholder {
    display: none;
    width: 130px; height: 70px;
    border: 2px dashed #c4c9d0;
    border-radius: 12px;
    color: #9aa0a6; font-size: 13px;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 2px;
  }

  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .subtitulo { font-size: 15px; color: #5f6368; margin-bottom: 20px; }

  .estrellas { font-size: 26px; letter-spacing: 3px; margin-bottom: 26px; }

  .boton {
    display: block;
    width: 100%;
    padding: 17px 16px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: none;
    text-decoration: none;
    margin-bottom: 14px;
    transition: transform .08s ease, box-shadow .2s ease;
  }
  .boton:active { transform: scale(.98); }

  .boton-bueno {
    background: #1e8e3e;
    color: #ffffff;
    box-shadow: 0 3px 10px rgba(30,142,62,.25);
  }
  .boton-malo {
    background: #ffffff;
    color: #3c4043;
    border: 1.5px solid #dadce0;
  }

  /* ---- Mensaje de gracias (oculto al inicio) ---- */
  #gracias { display: none; animation: aparecer .4s ease; }
  #gracias .check { font-size: 52px; margin-bottom: 12px; }
  #gracias h2 { font-size: 21px; margin-bottom: 10px; }
  #gracias p { font-size: 15px; color: #5f6368; line-height: 1.5; }

  .pie { margin-top: 22px; font-size: 12px; color: #bdc1c6; }
</style>
</head>

<body>
  <div class="tarjeta">

    <!-- Vista 1: la elección -->
    <div id="eleccion">
      <div class="logo-zona">
        <!-- 👉 TU LOGO: sube un archivo llamado  logo.png  junto a este index.html.
             Si no hay logo, se muestra un recuadro "Tu logo aquí". -->
        <img id="logo" src="logo.png" alt="Logo del local"
             onerror="this.style.display='none'; document.getElementById('logo-placeholder').style.display='flex';">
        <div id="logo-placeholder">🖼️<span>Tu logo aquí</span></div>
      </div>

      <h1 id="titulo">¡Gracias por tu visita!</h1>
      <p class="subtitulo">¿Cómo calificarías tu experiencia?</p>
      <div class="estrellas">⭐⭐⭐⭐⭐</div>

      <a id="btnBueno" class="boton boton-bueno" href="#" target="_blank" rel="noopener">😀 Excelente — 5 estrellas</a>
      <button class="boton boton-malo" onclick="mostrarGracias()">😕 Puede mejorar</button>
    </div>

    <!-- Vista 2: mensaje de gracias (aparece al tocar "Puede mejorar") -->
    <div id="gracias">
      <div class="check">🙏</div>
      <h2>¡Gracias por tu comentario!</h2>
      <p>Lamentamos no haberte dado una experiencia perfecta. Tu opinión nos ayuda a mejorar y la tomaremos muy en cuenta. ¡Esperamos verte pronto!</p>
    </div>

    <div class="pie" id="pie"></div>
  </div>

<script>
  // No necesitas tocar nada de aquí para abajo.
  document.getElementById('btnBueno').href = ENLACE_GOOGLE_MAPS;
  document.getElementById('titulo').textContent = '¡Gracias por tu visita a ' + NOMBRE_DEL_LOCAL + '!';
  document.getElementById('pie').textContent = NOMBRE_DEL_LOCAL;

  function mostrarGracias() {
    document.getElementById('eleccion').style.display = 'none';
    document.getElementById('gracias').style.display = 'block';
  }
</script>
</body>
</html>
